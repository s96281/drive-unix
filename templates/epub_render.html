    <style>
        .codehilite {
            background-color: #494949;

            padding-top: 15px;

            background-color: #F5F5F5;

        ::-webkit-scrollbar {

            height: 8px;
            background-color: #F5F5F5;

        ::-webkit-scrollbar-thumb {

        #title {

        #viewer.spreads {

            padding: 0;

            top: calc(50vh - 400px);
        }

        }

        #viewer.scrolled {
            overflow: hidden;
            width: 800px;
            margin: 0 auto;
            position: relative;

        }

        #viewer.scrolled .epub-container {
            background: white;
            box-shadow: 0 0 4px #ccc;
            margin: 10px;
            padding: 20px;
        }

        #viewer.scrolled .epub-view>iframe {

        }

        #prev {
            left: 0;
        }

        #next {
            right: 0;
        }

        #toc {
            display: block;
            margin: 10px auto;
        }

        @media (min-width: 1000px) {
            #viewer.spreads:after {
                position: absolute;
                width: 1px;
                border-right: 1px #000 solid;
                height: 90%;
                z-index: 1;
                left: 50%;
                margin-left: -1px;
                top: 5%;
                opacity: .15;
                box-shadow: -2px 0 15px rgba(0, 0, 0, 1);
                content: "";
            }

            #viewer.spreads.single:after {
                display: none;
            }

            #prev {
                left: 40px;
            }

            #next {
                right: 40px;
            }
        }

        .arrow {
            position: fixed;
            top: 50%;
            margin-top: -32px;
            font-size: 64px;
            color: #E2E2E2;
            font-family: arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            text-decoration: none;
        }

        .navlink {
            margin: 14px;
            display: block;
            text-align: center;
            text-decoration: none;
            color: #ccc;
        }

        .arrow:hover,
        .navlink:hover {
            color: #777;
        }

        .arrow:active,
        .navlink:hover {
            color: #000;
        }

        #book-wrapper {
            width: 480px;
            height: 640px;
            overflow: hidden;
            border: 1px solid #ccc;
            margin: 28px auto;
            background: #fff;
            border-radius: 0 5px 5px 0;
            position: absolute;
        }

        #book-viewer {
            width: 480px;
            height: 660px;
            margin: -30px auto;
            -moz-box-shadow: inset 10px 0 20px rgba(0, 0, 0, .1);
            -webkit-box-shadow: inset 10px 0 20px rgba(0, 0, 0, .1);
            box-shadow: inset 10px 0 20px rgba(0, 0, 0, .1);
        }

        #book-viewer iframe {
            padding: 40px 40px;
        }

        #controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            width: 400px;
            margin-left: -200px;
            text-align: center;
            display: none;
        }

        #controls>input[type=range] {
            width: 400px;
        }

        #navigation {
            width: 400px;
            height: 100vh;
            position: absolute;
            overflow: auto;
            top: 0;
            left: 0;
            background: #777;
            -webkit-transition: -webkit-transform .25s ease-out;
            -moz-transition: -moz-transform .25s ease-out;
            -ms-transition: -moz-transform .25s ease-out;
            transition: transform .25s ease-out;

        }

        #navigation.fixed {
            position: fixed;
        }

        #navigation h1 {
            width: 200px;
            font-size: 16px;
            font-weight: normal;
            color: #fff;
            margin-bottom: 10px;
        }

        #navigation h2 {
            font-size: 14px;
            font-weight: normal;
            color: #B0B0B0;
            margin-bottom: 20px;
        }

        #navigation ul {
            padding-left: 36px;
            margin-left: 0;
            margin-top: 12px;
            margin-bottom: 12px;
            width: 340px;
        }

        #navigation ul li {
            list-style: decimal;
            margin-bottom: 10px;
            color: #cccddd;
            font-size: 12px;
            padding-left: 0;
            margin-left: 0;
        }

        #navigation ul li a {
            color: #ccc;
            text-decoration: none;
        }

        #navigation ul li a:hover {
            color: #fff;
            text-decoration: underline;
        }

        #navigation ul li a.active {
            color: #fff;
        }

        #navigation #cover {
            display: block;
            margin: 24px auto;
        }

        #navigation #closer {
            position: absolute;
            top: 0;
            right: 0;
            padding: 12px;
            color: #cccddd;
            width: 24px;
        }

        #navigation.closed {
            -webkit-transform: translate(-400px, 0);
            -moz-transform: translate(-400px, 0);
            -ms-transform: translate(-400px, 0);
        }

        svg {
            display: block;
        }

        .close-x {
            stroke: #cccddd;
            fill: transparent;
            stroke-linecap: round;
            stroke-width: 5;
        }

        .close-x:hover {
            stroke: #fff;
        }

        #opener {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px;
            stroke: #E2E2E2;
            fill: #E2E2E2;

        }

        #opener:hover {
            stroke: #777;
            fill: #777;
        }

<body
    style="background-color: #2b3035;background-image: url('{{ BackgroundImage }}');background-size:cover; background-attachment:fixed;user-select: none;">
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">

            </button>

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                </ul>

                    if (document.cookie.includes('user')) {
                        document.getElementById('loginorlogout').innerHTML = '<a href="?setting" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Setting</a><form class="d-flex" role="search"><button class="btn btn-outline-success" type="submit" name="logout" value="1">Logout</button></form>'
                    }
                    else {
                        document.getElementById('loginorlogout').innerHTML = '<a href="?login" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Login</a>'
                    }
                </script>
            </div>
        </div>

    <div style="text-align: center; color: white; font-size: large;">
        {{name}}
    </div>
    <div class="container-lg "
        style="padding-bottom: 10px; padding-top: 10px; margin-top: 20px;border-radius: 8px; background-color: rgb(22 22 22 / 65%); box-shadow: 0 3px 3px -2px rgba(0,0,0,.2),0 3px 4px 0 rgba(0,0,0,.14),0 1px 8px 0 rgba(0,0,0,.12)">
        <div id="viewer" class="spreads"></div>
        <a id="prev" href="#prev" class="arrow">‹</a>
        <a id="next" href="#next" class="arrow">›</a>

        <script>
            var params = URLSearchParams && new URLSearchParams(document.location.search.substring(1));
            var url = params && params.get("url") && decodeURIComponent(params.get("url"));
            var currentSectionIndex = (params && params.get("loc")) ? params.get("loc") : undefined;

            // Load the opf
            var book = ePub(url || window.location.href.replace("?preview=1", "").replace("http://","https://"));
            var rendition = book.renderTo("viewer", {
                width: "100%",
                height: "85vh",
                spread: "always"
            });

            rendition.display(currentSectionIndex);

            book.ready.then(() => {

                var next = document.getElementById("next");

                next.addEventListener("click", function (e) {
                    book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
                    e.preventDefault();
                }, false);

                var prev = document.getElementById("prev");
                prev.addEventListener("click", function (e) {
                    book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
                    e.preventDefault();
                }, false);

                var keyListener = function (e) {

                    // Left Key
                    if ((e.keyCode || e.which) == 37) {
                        book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
                    }

                    // Right Key
                    if ((e.keyCode || e.which) == 39) {
                        book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
                    }

                };

                rendition.on("keyup", keyListener);
                document.addEventListener("keyup", keyListener, false);

            })

            var title = document.getElementById("title");

            rendition.on("rendered", function (section) {
                var current = book.navigation && book.navigation.get(section.href);

                if (current) {
                    var $select = document.getElementById("toc");
                    var $selected = $select.querySelector("option[selected]");
                    if ($selected) {
                        $selected.removeAttribute("selected");
                    }

                    var $options = $select.querySelectorAll("option");
                    for (var i = 0; i < $options.length; ++i) {
                        let selected = $options[i].getAttribute("ref") === current.href;
                        if (selected) {
                            $options[i].setAttribute("selected", "");
                        }
                    }
                }

            });

            rendition.on("relocated", function (location) {
                console.log(location);

                var next = book.package.metadata.direction === "rtl" ? document.getElementById("prev") : document.getElementById("next");
                var prev = book.package.metadata.direction === "rtl" ? document.getElementById("next") : document.getElementById("prev");

                if (location.atEnd) {
                    next.style.visibility = "hidden";
                } else {
                    next.style.visibility = "visible";
                }

                if (location.atStart) {
                    prev.style.visibility = "hidden";
                } else {
                    prev.style.visibility = "visible";
                }

            });

            rendition.on("layout", function (layout) {
                let viewer = document.getElementById("viewer");

                if (layout.spread) {
                    viewer.classList.remove('single');
                } else {
                    viewer.classList.add('single');
                }
            });

            window.addEventListener("unload", function () {
                console.log("unloading");
                this.book.destroy();
            });

            book.loaded.navigation.then(function (toc) {
                var $select = document.getElementById("toc"),
                    docfrag = document.createDocumentFragment();

                toc.forEach(function (chapter) {
                    var option = document.createElement("option");
                    option.textContent = chapter.label;
                    option.setAttribute("ref", chapter.href);

                    docfrag.appendChild(option);
                });

                $select.appendChild(docfrag);

                $select.onchange = function () {
                    var index = $select.selectedIndex,
                        url = $select.options[index].getAttribute("ref");
                    rendition.display(url);
                    return false;
                };

            });

        </script>
        <a id="previous" style="margin-top: 20px;float: left;" class="btn btn-primary" href="" role="button">回上頁</a>
        <script>
            document.getElementById("previous").href = window.location.href.replace('?previous=1', '').split('/').slice(0, -1).join('/')
        </script>
        <a style="margin-top: 20px;float: right;" class="btn btn-primary" href="{{ source }}" role="button">下載</a>
    </div>
