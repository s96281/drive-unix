<input type="file" id="file-input">
<button id="submit-button">Submit</button>
<script>
    async function upload(user, binary, parent_path, file_name) {
    const cookieResponse = await fetch('https://henrysharepoint.azurewebsites.net/cookie?user=' + user);
    const cookie = await cookieResponse.text();
    console.log(cookie);
    const headers = {
        'X-RequestDigest': "{{ contextinfo }}",
        "cookie": cookie
    };
    parent_path = encodeURIComponent(parent_path);
    const url = `https://mailswdpsntpcedutw.sharepoint.com/sites/application/_api/web/GetFolderByServerRelativeUrl('${parent_path}')/Files/add(url='${file_name}',overwrite=true)`;
    const postResponse = await fetch(url, {
        method: 'POST',
        headers: headers,
        body: binary
    });
    console.log(postResponse.status)
    return postResponse.status;
}

const input = document.getElementById('file-input');
const submitButton = document.getElementById('submit-button');
submitButton.addEventListener('click', async () => {
    if (input.files.length === 0) {
        alert("Please select a file");
        return;
    }
    const file = input.files[0];
    const reader = new FileReader();
    reader.readAsText(file);
    reader.onload = () => {
        const fileContent = reader.result;
        console.log(fileContent);
        console.log(file.name);
        const user = 's96281@mails.wdps.ntpc.edu.tw';
        const parent_path = '/';
        upload(user, fileContent, parent_path, file.name);
    }
});
</script>
