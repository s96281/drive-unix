<!DOCTYPE html>
<html>

<head>
    <title>
        Flask-SharePoint
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://files.catbox.moe/yl8lnp.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "fxttinbrki");
    </script>
    <style>
        .codehilite {
            background-color: #494949;
            border-radius: 10px;
            margin-bottom: 10px;
            padding-top: 15px;
            padding-left: 10px;
            padding-bottom: 1px;
        }

        ::-webkit-scrollbar-track {
            border: 1px solid black;
            background-color: #F5F5F5;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 8px;
            background-color: #F5F5F5;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #000000;
        }
    </style>
</head>

<body
    style="background-color: #2b3035;background-image: url('{{ BackgroundImage }}');background-size:cover; background-attachment:fixed;user-select: none;">
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                </ul>
                <a href="?reflash" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Reflash</a>
                <div id='loginorlogout' style="display: flex;"></div>
                <script>
                    if (document.cookie.includes('user')) {
                        document.getElementById('loginorlogout').innerHTML = '<a href="?setting" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Setting</a><a href="?logout" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Logout</a>'
                    }
                    else {
                        document.getElementById('loginorlogout').innerHTML = '<a href="?login" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Login</a>'
                    }
                </script>
            </div>
        </div>
    </nav>
    {% if headnote %}
    <div class="container-lg "
        style="margin-top: 20px;border-radius: 8px; background-color: rgb(22 22 22 / 85%); box-shadow: 0 3px 3px -2px rgba(0,0,0,.2),0 3px 4px 0 rgba(0,0,0,.14),0 1px 8px 0 rgba(0,0,0,.12)">
        <div id="headnot" class="rounded" style="color: white; padding-top: 10px; padding-bottom: 10px;">
            {{ headnote }}
        </div>
    </div>
    {% endif %}
    <div class="container-lg "
        style="margin-top: 20px;border-radius: 8px; background-color: rgb(22 22 22 / 65%); box-shadow: 0 3px 3px -2px rgba(0,0,0,.2),0 3px 4px 0 rgba(0,0,0,.14),0 1px 8px 0 rgba(0,0,0,.12)">
        <table class="table" style="color: white;">
            <thead>
                <tr>
                    {% for header in headings %}
                    <th scope="col">{{ header }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in FILELIST %}
                <tr style="height: 50px;vertical-align: middle;"
                    oncontextmenu='navigator.clipboard.writeText("{{ row[3] }}");tempAlert("已複製鏈結",1000)'
                    onclick="window.location='{{ row[3] }}';">
                    <td style="cursor: pointer;width:60%">{{ row[0] }}</td>
                    <td style="cursor: pointer;width:25%">{{ row[1] }}</td>
                    <td style="cursor: pointer;width:15%">{{ row[2] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% if footnote %}
    <div class="container-lg "
        style="margin-top: 20px;margin-bottom: 20px;border-radius: 8px; background-color: rgb(22 22 22 / 85%); box-shadow: 0 3px 3px -2px rgba(0,0,0,.2),0 3px 4px 0 rgba(0,0,0,.14),0 1px 8px 0 rgba(0,0,0,.12)">
        <div id="footnot" class="rounded" style="color: white; padding-top: 10px; padding-bottom: 10px;">
            {{ footnote }}
        </div>
    </div>
    {% endif %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
        integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD" crossorigin="anonymous">
        </script>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        function tempAlert(msg, duration) {
            var el = document.createElement("div");
            el.setAttribute("class", "alert alert-warning show");
            el.setAttribute("style", "position: absolute;left: 10px;bottom: 10px;")
            el.innerHTML = msg;
            setTimeout(function () {
                el.parentNode.removeChild(el);
            }, duration);
            document.body.appendChild(el);
        }
    </script>
</body>

</html>
