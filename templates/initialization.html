<!DOCTYPE html>
<html>

<head>
    <title>
        初始化資料庫
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://files.catbox.moe/yl8lnp.svg"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
</head>

<body style="color:white; background-color: #2b3035">
    <div class="container-xxl"
        style="backdrop-filter: blur(5px); background-color: rgba(0, 0, 0, 0.4); margin-top: 20px; padding: 50px; border-radius: 10px">
        <h1>全域變數</h1>
        </br>
        <form method="post">
            <div class="input-group mb-3">
                <span class="input-group-text">User Name</span>
                <input type="text" class="form-control" placeholder='填入管理員帳號' name="local_user"
                    value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Password</span>
                <input type="text" class="form-control" placeholder='填入管理員密碼' name="local_password"
                    value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">網頁背景圖</span>
                <input type="text" class="form-control" placeholder='URL1,URL2,...(以","結尾)' name="background"
                    value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">公開網站</span>
                <select class="form-select" name="anonymous_viewlist">
                    <option selected>是否開放網站(不須登入即可檢視目錄)</option>
                    <option value="0">是</option>
                    <option value="1">否</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">匿名下載</span>
                <select class="form-select" name="anonymous_download">
                    <option selected>是否開放匿名下載(不須登入即可下載)</option>
                    <option value="0">是</option>
                    <option value="1">否</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">快取</span>
                <select class="form-select" name="CACHE_TYPE">
                    <option selected>設定伺服器快取形式</option>
                    <option value="NullCache">NullCache</option>
                    <option value="FileSystemCache">FileSystemCache</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">加密</span>
                <select class="form-select" name="CACHE_TYPE">
                    <option selected>設定頁面加密方式</option>
                    <option value="page">資料夾加密</option>
                    <option value="drive">全盤加密</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">passfile</span>
                <input type="text" class="form-control" placeholder="自訂密碼文件的名字，可以是'pppppp'，也可以是'aaaa.txt'等等；列目錄時不會顯示，只有知道密碼才能查看或下載此文件。密碼是這個文件的內容，可以空格、可以中文；" name="passfile"
                    value="">
            </div>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5" style="color: white;">
                <div class="col">
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" value="True" name="top_md" id="top_md">
                        <label class="form-check-label" for="top_md">顯示Header</label>
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" value="True" name="bottom_md" id="bottom_md">
                        <label class="form-check-label" for="bottom_md">顯示footer</label>
                    </div>
                </div>
            </div>
        </br>
        </br>
        <h1>SharePoint設定</h1>
            <div class="input-group mb-3">
                <span class="input-group-text">Name</span>
                <input type="text" class="form-control" name="alia"
                    value="" />
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Type</span>
                <select class="form-select" name="type">
                    <option value="SharePointSitePW">SharePointSite</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Site</span>
                <input type="text" class="form-control" name="site"
                    value="" />
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Host</span>
                <input type="text" class="form-control" placeholder=""
                    name="endpoint" value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Email address</span>
                <input type="text" class="form-control" placeholder=""
                    name="username" value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Password</span>
                <input type="password" class="form-control" placeholder=""
                    name="password" value="">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
        integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD"
        crossorigin="anonymous"></script>
</body>

</html>
