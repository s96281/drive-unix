<!DOCTYPE html>
<html>

<head>
    <title>
        initialization
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
</head>

<body style="color:white; background-color: #2b3035">
    <div class="container-xxl"
        style="backdrop-filter: blur(5px); background-color: rgba(0, 0, 0, 0.4); margin-top: 20px; padding: 50px; border-radius: 10px">
        <h1>全域變數</h1>
        </br>
        <form method="post">
            <div class="input-group mb-3">
                <span class="input-group-text">User Name</span>
                <input type="text" class="form-control" placeholder='填入登入帳號' name="local_user"
                    value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Password</span>
                <input type="text" class="form-control" placeholder='填入登入密碼' name="local_password"
                    value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">BackgroudImageList</span>
                <input type="text" class="form-control" placeholder='["URL1", "URL2", "URL3"...]' name="background"
                    value="">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">CheckPermission</span>
                <select class="form-select" name="checkpermission">
                    <option selected>匿名下載</option>
                    <option value="0">是</option>
                    <option value="1">否</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Cache type</span>
                <select class="form-select" name="CACHE_TYPE">
                    <option selected>設定伺服器快取形式</option>
                    <option value="NullCache">NullCache</option>
                    <option value="FileSystemCache">FileSystemCache</option>
                </select>
            </div>
        </br>
        </br>
        <h1>SharePoint設定</h1>
            <div class="input-group mb-3">
                <span class="input-group-text">Host</span>
                <input type="text" class="form-control" placeholder="填入https://xxxxxx.sharepoint.com/" name="Host">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Email address</span>
                <input type="text" class="form-control" placeholder="填入帳號電子郵件" name="Account">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Password</span>
                <input type="password" class="form-control" placeholder="填入密碼" name="Password">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Sites</span>
                <input type="text" class="form-control" placeholder="填入網站名稱，多個網站以空格隔開" name="Sites">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
        integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD"
        crossorigin="anonymous"></script>
</body>

</html>
