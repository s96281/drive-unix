<!DOCTYPE html>
<html>

<head>
    <title>
        Access Token initialize | Flask-SharePoint
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://files.catbox.moe/yl8lnp.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
</head>

<body
    style="background-color: #2b3035;background-image: url('{{ BackgroundImage }}');background-size:cover; background-attachment:fixed;user-select: none;">
    <div style="width: 300px;height: 300px;position: absolute;top: 50%;left: 50%;margin: -150px 0 0 -150px">
        <p style="color: red;text-align: center;">{{ Warning }}</p>
        <p style="color: white;text-align: center;">Press the button to get the authorization code</p>
        <a class="btn btn-primary" href="{{ authorization_url }}" role="button" target="_blank">Click</a>        
        <form method="post">
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label" style="color: white;">code</label>
                <input type="text" class="form-control" id="exampleInputPassword1" name="code">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>

</html>
