<!DOCTYPE html>
<html>

<head>
    <title>
        {{name}} | Flask-SharePoint
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://files.catbox.moe/yl8lnp.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.3/plyr.css" />
</head>

<body
    style="background-color: #2b3035;background-image: url('{{ BackgroundImage }}');background-size:cover; background-attachment:fixed;user-select: none;">
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                </ul>
                <a href="/reflash" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Reflash</a>
                <div id='loginorlogout' style="display: flex;"></div>
                <script>
                    if (document.cookie.includes('user')) {
                        document.getElementById('loginorlogout').innerHTML = '<a href="/setting" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Setting</a><form class="d-flex" role="search"><button class="btn btn-outline-success" type="submit" name="logout" value="1">Logout</button></form>'
                    }
                    else {
                        document.getElementById('loginorlogout').innerHTML = '<a href="/login" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Login</a>'
                    }
                </script>
            </div>
        </div>
    </nav>
    <div class="container-lg "
        style="margin-top: 20px;border-radius: 8px; background-color: rgb(22 22 22 / 65%); box-shadow: 0 3px 3px -2px rgba(0,0,0,.2),0 3px 4px 0 rgba(0,0,0,.14),0 1px 8px 0 rgba(0,0,0,.12)">
        {% if mediatype == 'video' %}
        <div style="text-align: center; color: white;">
            {{name}}
        </div>
        <video id="player" playsinline controls data-poster="/path/to/poster.jpg" preload="none" style="margin-bottom: 10px;">
            <source id="source" src="" />
            <script>
                var URL = window.location.href.replace('preview=1', 'download=1');
                document.getElementById('source').src = URL;
            </script>
            <!-- Captions are optional -->
            <!-- <track kind="captions" label="Zh-tw captions" src="/path/to/captions.vtt" srclang="tw" default /> -->
        </video>
        <script src="https://cdn.plyr.io/3.7.3/plyr.polyfilled.js"></script>
        <script>
            const player = new Plyr('#player', {
                enabled: true,
                debug: true,
                controls: ['play-large', 'restart', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'download', 'fullscreen',],
                settings: ['captions', 'quality', 'speed', 'loop'],
                keyboard: { focused: true, global: true },
                speed: { selected: 1, options: [0.1, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 4] },
            });

            var sub = window.location.href.replace('mp4?preview=1', 'ass?download=1')
            sub = window.location.href.replace('mkv?preview=1', 'ass?download=1')

            player.on('ready', function () {
                var video = document.getElementById('player');
                window.SubtitlesOctopusOnLoad = function() {
                    var options = {
                        video: video,
                        subUrl: sub,
                        fonts: ['https://files.catbox.moe/i0eiva.ttf', 'https://files.catbox.moe/fboung.ttf', 'https://files.catbox.moe/2z74rb.ttf', 'https://files.catbox.moe/3xp5xr.ttf', 'https://files.catbox.moe/twxdgs.ttf'],
                        //onReady: onReadyFunction,
                        //debug: true,
                        workerUrl:'/subtitles-octopus-worker.js'
                    };
                    window.octopusInstance = new SubtitlesOctopus(options); // You can experiment in console
                };
                if (SubtitlesOctopus) {
                    SubtitlesOctopusOnLoad();
                }
            });
        </script>
        {% elif mediatype == 'office' %}
        <iframe src='https://view.officeapps.live.com/op/embed.aspx?src={{source}}' width="100%" style="height: 80vh;"
            frameborder='0'>
        </iframe>
        {% elif mediatype == 'image' %}
        <img src="{{source}}" width="100%" height="100%">
        {% elif mediatype == 'audio' %}
        <div id="app" style="text-align: center"></div>
        <!-- 加载 cplayer 脚本 -->
        <script src="https://cdn.jsdelivr.net/npm/cplayer/dist/cplayer.min.js"></script>
        <script>
            let player = new cplayer(
                {
                    element: document.getElementById('app'),
                    big: true,
                    dark: true,
                    playlist: [
                        {
                            src: '{{source}}',
                            poster: 'https://files.catbox.moe/ynjcw9.png',
                            name: '{{name}}'
                        }
                    ]
                }
            )
        </script>
        {% elif mediatype == 'text'%}
        <pre style="color: white;">
            {{txt}}
        </pre>
        {% elif mediatype == 'programe' %}
        <div style="color: white;">
            {{txt | safe}}
        </div>
        {% endif %}
        <a style="margin-top: 10px;margin-bottom: 10px;float: right;" class="btn btn-primary" href="{{ source }}"
            role="button">下載</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
        integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD"
        crossorigin="anonymous"></script>
</body>

</html>
