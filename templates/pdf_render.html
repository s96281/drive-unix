<!DOCTYPE html>
<html>

<head>
    <title>
        {{name}} | Flask-SharePoint
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://files.catbox.moe/yl8lnp.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "fxttinbrki");
    </script>
</head>

<body
    style="background-color: #2b3035;background-image: url('{{ BackgroundImage }}');background-size:cover; background-attachment:fixed;user-select: none;">
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                </ul>
                <a href="?reflash" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Reflash</a>
                <div id='loginorlogout' style="display: flex;"></div>
                <script>
                    if (document.cookie.includes('user')) {
                        document.getElementById('loginorlogout').innerHTML = '<a href="?setting" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Setting</a><form class="d-flex" role="search"><button class="btn btn-outline-success" type="submit" name="logout" value="1">Logout</button></form>'
                    }
                    else {
                        document.getElementById('loginorlogout').innerHTML = '<a href="?login" class="btn btn-outline-success" role="button" style="margin-right: 5px;">Login</a>'
                    }
                </script>
            </div>
        </div>
    </nav>
    <div style="text-align: center; color: white; font-size: large;">
        {{name}}
    </div>
    <div class="container-lg "
        style="padding-bottom: 10px; padding-top: 10px; margin-top: 20px;border-radius: 8px; background-color: rgb(22 22 22 / 65%); box-shadow: 0 3px 3px -2px rgba(0,0,0,.2),0 3px 4px 0 rgba(0,0,0,.14),0 1px 8px 0 rgba(0,0,0,.12)">
        <div id="viewer" class="spreads"></div>
        <div id="adobe-dc-view" style="height: 80vh"></div>
        <script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
        <script type="text/javascript">
            document.addEventListener("adobe_dc_view_sdk.ready", function () {
                var adobeDCView = new AdobeDC.View({ clientId: "b22132343b4f44d9a4ced80cf3308239", divId: "adobe-dc-view" });
                adobeDCView.previewFile(
                    {
                        content: { location: { url: "{{source}}" } },
                        metaData: { fileName: "{{name}}" }
                    });
            });
        </script>
        <a id="previous" style="margin-top: 20px;float: left;" class="btn btn-primary" href="" role="button">回上頁</a>
        <script>
            document.getElementById("previous").href = window.location.href.replace('?previous=1', '').split('/').slice(0, -1).join('/')
        </script>
        <a style="margin-top: 20px;float: right;" class="btn btn-primary" href="{{ source }}" role="button">下載</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
        integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD" crossorigin="anonymous">
        </script>
</body>

</html>
