<!DOCTYPE html>

<head>
    <title>
        {{title}}
    </title>
</head>

<body style="height: 100vh; margin: 0;background-color: #222222;">
    <div id="image_div" style="height: 100vh;margin: 0;display: flex;align-items: center;justify-content: center;">
    <img id="image" onclick="imagesizing()" style="max-height: 100%; max-width: 100%;" src="{{pic_url}}">
    </div>
    <script>
        var a = 0;
        function imagesizing(){
            if (a == 0) {
                document.getElementById('image_div').style.height = 'auto';
                document.getElementById('image').style.maxWidth = 'unset';
                document.getElementById('image_div').style.display = 'block';
                a = 1;
            }
            else {
                document.getElementById('image_div').style.height = '100vh';
                document.getElementById('image').style.maxWidth = '100%';
                document.getElementById('image_div').style.display = 'flex';
                a = 0;
            }
        }
    </script>
</body>
