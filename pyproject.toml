[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-unix"
version = "0.1.0"
description = "Multi-provider file management and synchronization CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "fuzzywuzzy>=0.18",
    "keyring>=25",
    "pydantic>=2.0",
    "requests>=2.31",
    "rich>=13.7",
    "tomlkit>=0.12",
    "typer>=0.12",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
onedrive = [
    "requests-oauthlib>=2.0",
]
sharepoint = [
    "playwright>=1.40",
]
sftp = [
    "paramiko>=3.4",
]
speedups = [
    "python-Levenshtein>=0.25",
]
all = [
    "fastapi>=0.110.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "httpx>=0.27.0",
    "paramiko>=3.4",
    "playwright>=1.40",
    "python-Levenshtein>=0.25",
    "python-multipart>=0.0.9",
    "requests-oauthlib>=2.0",
    "sse-starlette>=2.0.0",
    "uvicorn>=0.28.0",
]
dev = [
    "build>=1.2",
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.8",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
drive-unix = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "application*",
    "auth*",
    "cli*",
    "core*",
    "domain*",
    "infrastructure*",
    "providers*",
    "storage*",
    "web*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Phase 6 establishes a blocking correctness gate first. Style/modernization
# rules can be tightened independently without mixing them with packaging work.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
files = [
    "application",
    "domain",
    "storage",
    "infrastructure",
]
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
show_error_codes = true

