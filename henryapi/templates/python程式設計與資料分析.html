<!DOCTYPE html>
<html>

<head>
    <title>
        宜蘭大學-111年-Python程式設計與資料分析-期末報告
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="width:98vw">
    {% if TEXT == "" %}
    <div style="display: flex">
        <div style="margin-top: 40vh;">
            <table>
                <thead>
                    <tr>
                        <th colspan="2">排行榜</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>{{user1}}</td>
                        <td>{{score1}}</td>
                    </tr>
                    <tr>
                        <td>{{user2}}</td>
                        <td>{{score2}}</td>
                    </tr>
                    <tr>
                        <td>{{user3}}</td>
                        <td>{{score3}}</td>
                    </tr>
                    <tr>
                        <td>{{user4}}</td>
                        <td>{{score4}}</td>
                    </tr>
                    <tr>
                        <td>{{user5}}</td>
                        <td>{{score5}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div style="width:min(1000px,90%);margin:0 auto;">
            <img style="width: 100%;" src="{{image}}">
            <div style="margin:0 auto;text-align: center;">
                <hr size="4px" style="height:5px;border:none;border-top:5px solid black;">
                <p>
                    選擇正確答案
                </p>
                <form method="post">
                    <input style="width:40%;height: 100px;margin-right: 2%;margin-bottom: 2%;" type="submit"
                        name="{{a}}" value="{{A}}">
                    <input style="width:40%;height: 100px;margin-left: 2%;margin-bottom: 2%;" type="submit" name="{{b}}"
                        value="{{B}}">
                    <input style="width:40%;height: 100px;margin-right: 2%;margin-top: 2%;" type="submit" name="{{c}}"
                        value="{{C}}">
                    <input style="width:40%;height: 100px;margin-left: 2%;margin-top: 2%;" type="submit" name="{{d}}"
                        value="{{D}}">
                </form>
            </div>
        </div>
    </div>
    {% elif TEXT == "正確" %}
    <div style="width:min(1000px,90%);margin:0 auto">
        <p style="font-size: xx-large;">{{TEXT}}</p>
        <div id="timer">
            5
        </div>
        <div>秒後進入下一題</div>
    </div>
    <script>
        var timer = document.querySelector("#timer");
        var number = 5;
        setInterval(function () {
            number--;
            if (number <= 0) {
                number = 0;
                location = location;
            }
            timer.innerText = number + 0
        }, 1000);
    </script>
    {% elif TEXT == "錯誤" %}
    <div style="width:min(1000px,90%);margin:0 auto">
        <p style="font-size: xx-large;">{{TEXT}}</p>
        <p>正確答案為：{{answer}}</p>
        <div id="timer">
            5
        </div>
        <div>秒後進入下一題</div>
    </div>
    <script>
        var timer = document.querySelector("#timer");
        var number = 5;
        setInterval(function () {
            number--;
            if (number <= 0) {
                number = 0;
                location = location;
            }
            timer.innerText = number + 0
        }, 1000);
    </script>
    {% endif %}
</body>

</html>
