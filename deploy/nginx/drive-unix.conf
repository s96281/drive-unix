# ==============================================================================
# drive-unix Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Features:
#   1. Upstream keepalive connection pooling to FastAPI/Uvicorn backend.
#   2. Zero-buffering & extended timeouts for Server-Sent Events (SSE).
#   3. Static asset caching (30 days immutable for /assets/).
#   4. REST API & OpenAPI docs forwarding.
#   5. SPA deep linking support & large file upload tolerance.
# ==============================================================================

# 1. 後端連線池定義 (使用 Keep-Alive 避免頻繁 TCP 握手)
upstream drive_unix_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 2. HTTP 80 伺服器 (若啟用 SSL 則轉導至 443，未啟用時可直接作為主服務)
server {
    listen 80;
    listen [::]:80;
    server_name drive.example.com; # 請替換為您的實際網域或 VPS IP

    # 大檔案上傳支援 (可自訂至 10G ~ 50G，配合雲端儲存大檔傳輸)
    client_max_body_size 50G;
    client_body_buffer_size 512k;

    # Gzip 壓縮設定 (加速 JSON 與一般文字傳輸，但嚴禁壓縮 SSE)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;

    # 安全防護標頭
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 路由 1: 前端 Vite 打包靜態資源 (具備 Content Hash 檔名，可安全快取 30 天)
    # --------------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://drive_unix_backend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 路由 2: SPA 入口 index.html (絕不可快取，確保客戶端隨時載入最新版本)
    # --------------------------------------------------------------------------
    location = /index.html {
        proxy_pass http://drive_unix_backend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # --------------------------------------------------------------------------
    # 路由 3: Server-Sent Events (SSE) 即時串流端點 (關鍵核心配置)
    # 涵蓋 /api/events (全域事件) 與 /api/sync/tasks/{id}/events (單一傳輸任務串流)
    #
    # 【技術原理深入說明：為什麼此處必須完全關閉 proxy_buffering？】
    # 1. Nginx 預設行為開啟 proxy_buffering on，會將後端的回應資料暫存於記憶體緩衝區
    #    (通常為 4KB 或 8KB)，直到累積達緩衝區上限或連線關閉時才一次性 flush 給客戶端。
    # 2. drive-unix 的 SSE 事件 (如 task.update, heartbeat) 單一封包僅約 100~300 bytes。
    #    若未關閉緩衝，Nginx 會扣留事件數十秒至數分鐘，導致前端網頁進度條停滯在 0% (假死)，
    #    直到任務完成或連線關閉時才瞬間噴發所有歷史事件，完全喪失即時監控能力。
    # 3. 此外，預設的 proxy_read_timeout 為 60 秒；大型備份傳輸任務可能持續數小時，
    #    若未延長超時時間，長連線將被 Nginx 強制切斷，引發連線中斷與重複連線風暴。
    # 4. 因此必須強制配置：
    #    - proxy_buffering off: 關閉緩衝，後端每推播一個 event 即時傳輸至客戶端。
    #    - proxy_cache off: 停用代理快取，避免串流回應被其他請求複用。
    #    - proxy_http_version 1.1 & proxy_set_header Connection "": 維持 HTTP/1.1 長連線。
    #    - chunked_transfer_encoding on: 啟用分塊傳輸編碼。
    #    - gzip off: 關閉 Gzip 壓縮，避免壓縮演算法等待資料區塊而產生延遲。
    #    - proxy_read_timeout / proxy_send_timeout 86400s: 延長超時至 24 小時。
    # --------------------------------------------------------------------------
    location ~ ^/api/(events|sync/tasks/.*/events) {
        proxy_pass http://drive_unix_backend;
        proxy_http_version 1.1;

        # 清除 Connection 標頭，啟用 upstream keepalive 連線複用
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 核心優化：關閉緩衝與快取，確保 SSE 即時推送
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;

        # 延長連線超時時間 (24 小時)，維持長連線不被中斷
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 路由 4: 標準 REST API 與 OpenAPI 介面
    # --------------------------------------------------------------------------
    location ~ ^/(api|docs|redoc|openapi\.json) {
        proxy_pass http://drive_unix_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 路由 5: 前端 SPA 深度連結路由轉發 (Single Page Application Fallback)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://drive_unix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
